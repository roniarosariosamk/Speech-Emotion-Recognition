name: Speech Emotion Recognition CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: "Speech Emotion Recognition/Source_Code" 


    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "Speech Emotion Recognition/Source_Code/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Speech Emotion Recognition/Source_Code/requirements.txt"

      - name: Run tests
        run: |
          python -m pytest "Speech Emotion Recognition/Source_Code/tests" -v

